name: Collect and deploy

# Every six hours, plus a button in the Actions tab for running it by hand.
#
# Six rather than three because of Blockscout's budget: 100,000 credits a
# month at 20 credits a call is 5,000 calls, and the interval multiplies
# whatever each run spends.
#
# The collector cannot live on Cloudflare: one run makes about 2,200 outbound
# requests against a 50-subrequest limit on Workers' free plan, takes ~10
# minutes, and needs a filesystem for its cache. So it runs here, and only its
# output - a handful of static JSON files - goes to Pages.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Two runs writing the same snapshot file would race, and a slow one should
# not be cut short by the next tick.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Room for the collector's 35-minute fresh-read budget, the cached tail
    # after it, the step backstop, and committing and deploying afterwards.
    # The collector is what keeps a run inside this now, not the timeout -
    # this is only the outer wall.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The chain cache is what keeps a run affordable: holder reads, deployers
      # and logos are remembered so only new tokens cost anything. It is
      # derived data, so a cache miss is slow rather than wrong.
      #
      # The key rotates per run and restore-keys falls back to the newest
      # earlier one, because GitHub cache entries are immutable - a fixed key
      # would be written once and never updated again.
      - name: Restore chain cache
        uses: actions/cache/restore@v4
        with:
          path: data/chain-cache.json
          key: chain-cache-${{ github.run_id }}
          restore-keys: chain-cache-

      - name: Collect
        # A backstop, well past the collector's own fresh-read budget. If this
        # fires, the collector has hung rather than merely run long - and the
        # save step below still runs, because it no longer depends on the job
        # succeeding.
        timeout-minutes: 75
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          RHC_RPC_URL: ${{ secrets.RHC_RPC_URL }}
        run: npm run once

      # Snapshots are the history the trend strip draws, so unlike the cache
      # they have to survive properly. storage.js caps the file, so this stays
      # bounded rather than growing forever.
      # Unconditional, and immediately after collecting.
      #
      # This used to happen inside actions/cache's post step, which only runs
      # when the job succeeds. A timeout is not success, so a run killed at
      # 60 minutes discarded every read it had paid for - and the next run,
      # starting from the same cache, died at the same place. `always()` is
      # what breaks that loop: whatever a run managed to read is kept, even if
      # nothing else about it went right.
      - name: Save chain cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/chain-cache.json
          key: chain-cache-${{ github.run_id }}

      - name: Commit snapshots
        run: |
          git config user.name "alphet-collector"
          git config user.email "actions@github.com"
          git add data/snapshots.json

          if git diff --staged --quiet; then
            echo "  no new reading to commit"
            exit 0
          fi

          git commit -m "reading $(date -u +%Y-%m-%dT%H:%MZ)"

          # main moves while we are collecting, and this job holds a checkout
          # for half an hour. Pushing the site is now a one-command operation
          # that deploys in thirty seconds, so an ordinary CSS edit during a
          # collection window is enough to make this push stale.
          #
          # Without the rebase it simply lost: on 2026-09-11 the 02:52 run
          # collected for 35 minutes, spent its Blockscout credits, and died on
          # "! [rejected] (fetch first)". The failure took the deploy and the
          # cache save down with it, so the entire run produced nothing.
          #
          # The rebase is clean by construction: this commit touches only
          # data/snapshots.json, nothing else in the repo writes to that file,
          # and the concurrency group above stops two collection runs
          # overlapping. It is replaying one commit over unrelated ones.
          set +e
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push
            if [ $? -eq 0 ]; then
              echo "  snapshot pushed"
              exit 0
            fi
            echo "  push attempt $attempt was rejected; refetching"
            sleep 5
          done

          # Deliberately not fatal. public/api was already written on this
          # runner, so the deploy below still puts the new reading on the site
          # - only the durable history entry is missing. Failing here would
          # throw away a reading that is otherwise intact, which is the
          # mistake being fixed, not a smaller version of it.
          echo "::warning::snapshot commit could not be pushed after 3 attempts - the reading still deploys, but it is not in history"
          exit 0

      # A deploy replaces the whole site, so uploading a build with no api/ in
      # it does not leave the old data in place - it removes it. public/api is
      # generated and gitignored, so a checkout where the collector did not
      # finish has no data at all, and shipping that is strictly worse than
      # shipping nothing.
      #
      # run.js now exits non-zero when collection fails, which stops the job
      # before this. This is the second lock on the same door: the one thing
      # that must never happen is worth checking for directly.
      - name: Refuse to deploy an empty build
        run: |
          if [ ! -s public/api/latest.json ]; then
            echo "::error::public/api/latest.json is missing or empty - refusing to deploy a site with no data"
            exit 1
          fi
          echo "  public/api present ($(ls public/api | wc -l) files)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=alphet
